# Keeps the Supabase Free-plan project from being paused for inactivity.
# See `supabase/keepalive.sql` for the table and RPC this calls, and
# SPEC-CHATBOT.md §5 for why the project needs it at all.
#
# This is the one workflow in the repo that holds secrets. It deliberately does
# not check out the code: it needs no files, and not having them keeps the
# service role key — which bypasses RLS — away from anything that could echo it.
name: Supabase keep-alive

on:
  schedule:
    # 09:17 UTC daily (05:17 Toronto, EDT). Off the hour on purpose: scheduled
    # runs queue behind the top-of-hour crowd and are delayed most there.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive_ping RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # --fail-with-body: a non-2xx fails the job but still prints the body,
          # so a permission or schema-cache error is diagnosable from the log.
          # Both auth headers are sent: the project uses a new-format secret key
          # (sb_secret_...), and PostgREST rejects those with 401 unless the
          # `apikey` header is present — Bearer alone is not enough.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 20 \
            --max-time 30 \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
